<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulo Games</title>
<style>
  :root { --bg:#F6EFE8; --card:#FFFFFF; --ink:#4A2F2A; --muted:#8A6A64; --accent:#F08A24; --line:#EADFD4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1F1A17; --card:#2A2420; --ink:#F3E9E1; --muted:#C2ACA3; --accent:#F5A04A; --line:#3B322C; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 24px; }
  h1 { font-size:28px; line-height:1.2; margin:0 0 4px; }
  h2 { font-size:19px; margin:28px 0 8px; }
  .muted { color:var(--muted); font-size:14px; }
  .note { color:var(--muted); font-size:13px; font-style:italic; }
  a { color:var(--accent); font-weight:600; }
  nav { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; font-size:14px; }
  .langs { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; font-size:13px; }
  .langs a { font-weight:500; }
  .langs .current { font-weight:800; color:var(--ink); }
  ul { padding-left:20px; }
</style>
</head>
<body>
<main>
<div class="card" style="text-align:center">
<img src="regulo-games-logo.png" alt="Regulo Games" style="width:220px;max-width:70%;height:auto">
<p class="muted">Jogos de lógica e quebra-cabeças · Logic and puzzle games</p>
<h2>Jogos · Games</h2>
<p><a href="sudowoof/">SudoWoof 🐶</a></p>
<p class="muted">Contato · Contact: <a href="mailto:sudowoof.app@gmail.com">sudowoof.app@gmail.com</a></p>
</div>
</main>
</body>
</html>
